{% extends "base.html" %}

{% block title %}Add Trade - Portfolio Tracker{% endblock %}

{% block content %}
<h2>Add New Trade</h2>
<form method="POST" action="{{ url_for('add_trade') }}">
    <div>
        <label for="ticker">Ticker:</label>
        <input type="text" id="ticker" name="ticker" required>
    </div>
    <div>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
    </div>
    <div>
        <label for="price">Price:</label>
        <input type="number" id="price" name="price" step="0.01" required>
    </div>
    <div>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" step="0.0001" required>
    </div>
    <div>
        <label for="fees">Fees:</label>
        <input type="number" id="fees" name="fees" step="0.01" value="0.00">
    </div>
    <div>
        <label for="transaction_type">Transaction Type:</label>
        <select id="transaction_type" name="transaction_type" required>
            <option value="buy">Buy</option>
            <option value="sell">Sell</option>
        </select>
    </div>
    <div>
        <button type="submit">Add Trade</button>
    </div>
</form>
{% endblock %}
